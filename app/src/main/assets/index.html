<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Mobile 3D Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#eaf0fb;font:14px system-ui}header{padding:12px;background:#172338;display:flex;justify-content:space-between}main{height:65vh;position:relative}canvas{display:block;width:100%;height:100%;touch-action:none}.tools{padding:10px;display:flex;flex-wrap:wrap;gap:8px;background:#121d30}button{background:#24518a;color:white;border:0;border-radius:7px;padding:10px}label{display:flex;align-items:center;gap:8px;margin:8px}input{max-width:120px}.note{padding:8px;color:#9db0ca;font-size:12px}</style></head><body><header><b>⬡ Mobile 3D Studio</b><span>3D Workspace</span></header><main id="view"></main><section class="tools"><button onclick="add('cube')">＋ Cube</button><button onclick="add('sphere')">＋ Sphere</button><button onclick="add('cylinder')">＋ Cylinder</button><button onclick="saveScene()">Save JSON</button><label>Color <input id="color" type="color" value="#4d9cff" onchange="if(selected)selected.material.color.set(this.value)"></label><label>Scale <input id="scale" type="range" min=".3" max="2.5" step=".1" value="1" oninput="if(selected)selected.scale.setScalar(+this.value)"></label><label>Frame <input id="frame" type="range" min="0" max="250" value="0"></label></section><p class="note">Drag to orbit • pinch/scroll to zoom • tap a shape to select. Starter build: basic 3D primitives and controls; advanced modeling, rigging and GLB export are not included yet.</p><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script src="app.js"></script></body></html>
